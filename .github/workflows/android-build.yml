name: Android builds

on:
  push:
    branches:
      - qual
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android (${{ github.ref_name == 'main' && 'AAB' || 'Development' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Build Android app with EAS
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            PROFILE=production
            EXTENSION=aab
          else
            PROFILE=development
            EXTENSION=apk
          fi

          npx --yes eas-cli@latest build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json \
            --message "GitHub commit $GITHUB_SHA" \
            > "$RUNNER_TEMP/eas-build.json"

          BUILD_ID="$(node -e "const [build] = require(process.argv[1]); if (!build?.id) process.exit(1); process.stdout.write(build.id)" "$RUNNER_TEMP/eas-build.json")"
          BUILD_URL="$(node -e "const {expo}=require('./app.json'); if (!expo.owner || !expo.slug) throw new Error('Missing Expo owner/slug'); process.stdout.write('https://expo.dev/accounts/'+encodeURIComponent(expo.owner)+'/projects/'+encodeURIComponent(expo.slug)+'/builds/'+encodeURIComponent(process.argv[1]))" "$BUILD_ID")"
          echo "Build and installation page: $BUILD_URL"
          {
            echo "## Android build: $PROFILE"
            echo ""
            echo "[Open build and installation page]($BUILD_URL)"
            echo ""
            if [ "$PROFILE" = "development" ]; then
              echo "Install this development build on Android, then run \`npm run start:dev\` locally."
              echo "The installation QR code is in the build step logs and on the EAS page above."
            else
              echo "Download the AAB from Artifacts below for manual upload to Google Play Console."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROFILE" = "development" ]; then
            npx --yes qrcode@1.5.4 --type utf8 \
              --output "$RUNNER_TEMP/install-qr.txt" "$BUILD_URL"
            cat "$RUNNER_TEMP/install-qr.txt"
          fi

          ARTIFACT_URL="$(node -e "const [build] = require(process.argv[1]); if (!build?.artifacts?.buildUrl) throw new Error('Missing EAS build artifact URL'); process.stdout.write(build.artifacts.buildUrl)" "$RUNNER_TEMP/eas-build.json")"
          mkdir -p artifacts
          curl --fail --location --retry 3 \
            --output "artifacts/veronica-lens-${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}.${EXTENSION}" \
            "$ARTIFACT_URL"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veronica-lens-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
